[tox]
min_version = 4.05
# Non-EoL Python x non-EoL NumPy, per NumPy's supported-Python ranges
env_list =
    py{311, 312, 313, 314}-numpy{23, 24}
    py{312, 313, 314, 315}-numpy25
    lint
    format

[gh-actions]
python =
    3.11: py311-numpy{23, 24}
    3.12: py312-numpy{23, 24, 25}
    3.13: py313-numpy{23, 24, 25}
    3.14: py314-numpy{23, 24, 25}, lint, format
    3.15: py315-numpy25

[testenv]
description = run unit tests
commands = pytest {posargs:tests -vv}
extras = develop
deps =
    numpy23: numpy==2.3.*
    numpy24: numpy==2.4.*
    numpy25: numpy==2.5.*

[testenv:lint]
description = lint with ruff
skip_install = true
deps = ruff
commands = ruff check {posargs:src tests}

[testenv:format]
description = check formatting with ruff
skip_install = true
deps = ruff
commands = ruff format --check --diff {posargs:src tests}

[testenv:type]
deps=
    mypy
    pandas-stubs
commands = mypy trouve --follow-untyped-imports

[testenv:build]
skip_install = true
deps = build
commands = python -m build --no-isolation

[testenv:test-publish]
skip_install = true
deps = twine
commands =
    python -m twine check dist/*
    python -m twine upload -r testpypi dist/*

[testenv:publish]
skip_install = true
deps = twine
commands = python -m twine upload dist/*
