[tox]
min_version = 4.05
env_list = py{39, 310, 311, 312}-numpy{1,2}, py38, py313, lint, format

[gh-actions]
python =
    3.8: py38
    3.9: py39-numpy{1,2}
    3.10: py310-numpy{1,2}
    3.11: py311-numpy{1,2}, lint, format
    3.12: py312-numpy{1,2}
    3.13: py313

[testenv:py38]
description = run unit tests
commands = pytest {posargs:tests -vv}
extras = develop
deps =
  numpy1: numpy>=1.0,<2.0

[testenv:py313]
description = run unit tests
commands = pytest {posargs:tests -vv}
extras = develop
deps =
    numpy2: numpy>=2.0,<3.0

[testenv:py{38, 39, 310, 311, 312, 313}-numpy{1,2}]
description = run unit tests
commands = pytest {posargs:tests -vv}
extras = develop
deps =
  numpy1: numpy>=1.0,<2.0
  numpy2: numpy>=2.0,<3.0

[testenv:lint]
description = lint with ruff
skip_install = true
deps = ruff
commands = ruff check {posargs:src tests}

[testenv:format]
description = check formatting with ruff
skip_install = true
deps = ruff
commands = ruff format --check --diff {posargs:src tests}

[testenv:type]
deps=
    mypy
    pandas-stubs
commands = mypy trouve --follow-untyped-imports

[testenv:build]
skip_install = true
deps = build
commands = python -m build --no-isolation

[testenv:test-publish]
skip_install = true
deps = twine
commands =
    python -m twine check dist/*
    python -m twine upload -r testpypi dist/*

[testenv:publish]
skip_install = true
deps = twine
commands = python -m twine upload dist/*
