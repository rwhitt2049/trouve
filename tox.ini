[tox]
min_version = 4.05
env_list = py{39, 310, 311, 312, 313}, lint, format

[gh-actions]
python =
    3.9: py39
    3.10: py310
;    3.11: py311, lint, format  skipping lint and format for now
    3.11: py311
    3.12: py312
    3.13: py313


[testenv:py{39, 310, 311, 312, 313}]
description = run unit tests
commands = pytest {posargs:tests -vv}
extras = develop

[testenv:lint]
basepython=py311
skip_install = true
deps=
    flake8
    pep8-naming
commands = flake8 src/trouve

[testenv:format]
basepython=py311
skip_install = true
deps = black
commands = black src/trouve --check --diff

[testenv:type]
deps=
    mypy
    pandas-stubs
commands = mypy trouve --follow-untyped-imports

[testenv:build]
skip_install = true
deps = build
commands = python -m build --no-isolation

[testenv:test-publish]
skip_install = true
deps = twine
commands =
    python -m twine check dist/*
    python -m twine upload -r testpypi dist/*

[testenv:publish]
skip_install = true
deps = twine
commands = python -m twine upload dist/*
