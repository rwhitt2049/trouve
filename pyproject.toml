[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trouve"
description = "Event detection and transformation for time-series data"
readme = "README.rst"
authors = [{name = "Ry Whittington"}]
classifiers = [
    'Development Status :: 6 - Mature',
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'Intended Audience :: Manufacturing',
    'License :: OSI Approved :: MIT License',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX',
    'Operating System :: MacOS',
    'Programming Language :: Python :: 3.8',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering'
]
dynamic = ["version"]
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "toolz",
    "pandas",
]

[project.optional-dependencies]
develop = ["pytest"]
docs = [
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "sphinx-rtd-theme",
]

[project.urls]
Homepage = "https://github.com/rwhitt2049/trouve"
Documentation = "https://trouve.readthedocs.io/en/stable/"
Repository = "https://github.com/rwhitt2049/trouve"
Changelog = "https://trouve.readthedocs.io/en/stable/change_log.html"

[tool.setuptools.dynamic]
version = {attr = "trouve.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# target-version is inferred from requires-python
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "N"]

[tool.ruff.format]
quote-style = "double"
