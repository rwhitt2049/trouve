name: Trouve automation

on:
  # Post-merge check of what actually landed on the long-lived branches
  push:
    branches: [ "develop", "master" ]
  # Every push to an open PR; tests the merge result against the target branch
  pull_request:
    branches: [ "develop", "master" ]
  # Manual run for a branch without a PR (Actions tab -> Run workflow)
  workflow_dispatch:

# Cancel an in-progress run when a newer commit arrives for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    name: Test and lint with TOX (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox tox-gh-actions
    - name: Test with tox
      run: tox --parallel auto --parallel-live
  verify-platforms:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    name: Verify dev env
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - run: "python -m pip install -e .[develop]"
      - run: "python -c 'import trouve; print(trouve.__version__)'"
  # Single stable status check for branch protection; fails if any required
  # job failed or was cancelled, so matrix changes never require settings edits
  ci-ok:
    name: ci-ok
    if: always()
    needs: [qa, verify-platforms]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required jobs passed"
